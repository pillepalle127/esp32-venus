; Firmware fuer den ESP32-S3. Stand: Gesamtbuild (PLAN.md, Phase 1, Punkt 3).
;
; Bauen: pio run

[platformio]
default_envs = s3

[env:s3]
; Arduino 3.3.12 auf ESP-IDF 5.5.5. Der USB-Host-Treiber des CH348 braucht ein aktuelles IDF.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1

; 16 MB Flash, 8 MB Octal-PSRAM (GPIO 33-37 sind damit belegt)
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

monitor_speed = 115200
upload_speed = 460800

lib_deps =
    nrf24/RF24 @ 1.6.2
    mlesniew/PicoMQTT @ 1.3.0

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0

; Timing-Test: Pruefling. VE.Bus sendet hier wirklich, deshalb nur mit der
; Simulation verbinden, nie mit einem echten MultiPlus.
[env:s3_timing]
extends = env:s3
build_flags =
    ${env:s3.build_flags}
    -DVEBUS_TIMING_TEST

; Timing-Test: zweites Board, spielt den MultiPlus (sim/multiplus_sim.cpp).
[env:sim]
extends = env:s3
build_src_filter = -<*> +<../sim/>
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
